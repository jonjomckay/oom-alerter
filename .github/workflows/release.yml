name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_version=$(cargo +stable metadata --no-deps --format-version 1 | \
            python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$GITHUB_REF_NAME" = "v$package_version"
          printf 'version=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo +stable fmt -- --check
      - name: Check
        run: cargo +stable check --locked
      - name: Test
        run: cargo +stable test --locked
      - name: Lint
        run: cargo +stable clippy --locked -- -D warnings
      - name: Build release binary
        run: cargo +stable build --release --locked
      - name: Create source archive and checksum
        run: scripts/create-release-archive.sh "$version" dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/oom-alerter-${version}.tar.gz" \
            "dist/oom-alerter-${version}.tar.gz.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
